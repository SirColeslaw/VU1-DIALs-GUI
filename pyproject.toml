[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "vu1-dials-gui"
version = "1.0.0"
description = "PyQt6 GUI for controlling Streacom VU1 dial hardware with AIDA64 sensor integration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.4",
    "requests>=2.28",
    "Pillow>=9.0",
    "python_aida64",
]

[project.optional-dependencies]
crypto = ["cryptography>=41.0"]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "cryptography>=41.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print (catch stray prints)
]
ignore = [
    "S603",  # subprocess calls (not relevant here)
    "S607",  # partial executable path
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # Allow assert in tests
