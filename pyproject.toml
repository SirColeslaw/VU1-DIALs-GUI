[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "vu1-dials-gui"
version = "1.1.0"
description = "PyQt6 GUI for controlling Streacom VU1 dial hardware with AIDA64 sensor integration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["vu1", "dials", "aida64", "hardware", "monitoring", "gui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "PyQt6>=6.4",
    "requests>=2.28",
    "Pillow>=9.0",
]

[project.optional-dependencies]
crypto = ["cryptography>=41.0"]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "cryptography>=41.0",
]

[project.urls]
Homepage = "https://github.com/SirColeslaw/VU1-DIALs-GUI"
Repository = "https://github.com/SirColeslaw/VU1-DIALs-GUI"
Issues = "https://github.com/SirColeslaw/VU1-DIALs-GUI/issues"

[project.gui-scripts]
vu1-dials-gui = "vu1_dials_gui.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print (catch stray prints)
]
ignore = [
    "S603",  # subprocess calls (not relevant here)
    "S607",  # partial executable path
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # Allow assert in tests
